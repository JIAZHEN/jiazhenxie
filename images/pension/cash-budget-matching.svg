<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">What a £200 monthly cash budget could put into a pension</title><desc id="desc">Illustrative £110,000 salary, 5% current employee contribution, salary sacrifice. No extra match: £474 a month extra pension; 1:1 match to 8%: £749; 2:1 match: £1,422. The matching examples require different, explicitly assumed employer schemes.</desc><rect width="800" height="480" fill="#faf8f5"/><g font-family="Arial, sans-serif" fill="#262626"><text x="40" y="38" fill="#a34832" font-size="13" letter-spacing="2">CASH BUDGET → PENSION CONTRIBUTIONS</text><text x="40" y="82" font-size="30" font-weight="600">Same £200 cash budget. Different schemes.</text>
  <text x="40" y="118" font-size="16">No extra match</text><rect x="40" y="130" width="180.1694" height="26" rx="3" fill="#a34832"/><rect x="220.1694" y="130" width="0" height="26" fill="#4d704d"/><text x="230.1694" y="150" font-size="17" font-weight="600">£474</text><text x="40" y="201" font-size="16">£1 for £1, up to 8%</text><rect x="40" y="213" width="180.1694" height="26" rx="3" fill="#a34832"/><rect x="220.1694" y="213" width="104.49999999999999" height="26" fill="#4d704d"/><text x="334.6694" y="233" font-size="17" font-weight="600">£749</text><text x="40" y="284" font-size="16">£2 for £1, up to 12%</text><rect x="40" y="296" width="180.1694" height="26" rx="3" fill="#a34832"/><rect x="220.1694" y="296" width="360.33879999999994" height="26" fill="#4d704d"/><text x="590.5082" y="316" font-size="17" font-weight="600">£1,422</text>
  <text x="40" y="380" fill="#a34832" font-size="14">■ Extra employee pension, including tax/NI savings</text>
  <text x="40" y="404" fill="#4d704d" font-size="14">■ Additional employer matching</text>
  <text x="40" y="434" font-size="12" fill="#57534e">£110k salary · 5% current employee pension · 2026/27 · salary sacrifice.</text>
  <text x="40" y="452" font-size="12" fill="#57534e">Current employer: 3% / 5% / 10% respectively. Match caps: 8% for 1:1; 12% for 2:1.</text>
  <text x="40" y="470" font-size="12" fill="#57534e">Hypothetical schemes, not standard entitlements. Rounded extra contributions per month.</text></g></svg>