<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">How extra pension contributions could build over 32 years</title><desc id="desc">£500 extra monthly contributions at 3% real growth from age 35 to 67. Final extra pot £319,325. Comparison line shows contributions without growth. No fees. Not a guaranteed return.</desc><rect width="800" height="480" fill="#faf8f5"/><g font-family="Arial, sans-serif" fill="#262626"><text x="40" y="38" fill="#a34832" font-size="13" letter-spacing="2">TIME DOES SOME OF THE WORK</text><text x="40" y="82" font-size="30" font-weight="600">£500 extra a month, from age 35 to 67</text>
